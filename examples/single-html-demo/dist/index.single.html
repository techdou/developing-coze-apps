<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>AI 教学应用</title>
<style>
:root{--accent:#2563eb;--bg:#0f172a;--panel:#111827;--text:#f8fafc;--muted:#94a3b8}*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}body{display:grid;grid-template-rows:auto 1fr}.bar{min-height:58px;padding:10px 14px;display:flex;gap:12px;align-items:center;background:var(--panel);border-bottom:1px solid rgba(255,255,255,.1)}.brand{min-width:0;flex:1}.title{font-size:16px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.actions{display:flex;gap:8px}.btn{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:var(--text);padding:8px 11px;border-radius:10px;cursor:pointer;text-decoration:none;font:inherit}.btn.primary{background:var(--accent);border-color:transparent}.viewport{min-height:0}.frame{width:100%;height:100%;border:0;background:#fff}@media(max-width:560px){.sub{display:none}.btn span{display:none}}
</style></head><body>
<header class="bar"><div class="brand"><div class="title">AI 教学应用</div><div class="sub">课程交互与练习</div></div><div class="actions"><button class="btn" type="button" onclick="document.getElementById('app').src=document.getElementById('app').src">刷新</button><a class="btn primary" href="https://example.coze.site" target="_blank" rel="noopener noreferrer">新窗口打开</a></div></header>
<main class="viewport"><iframe id="app" class="frame" src="https://example.coze.site" title="AI 教学应用" referrerpolicy="strict-origin-when-cross-origin"  allow="fullscreen; microphone" allowfullscreen></iframe></main>
</body></html>
