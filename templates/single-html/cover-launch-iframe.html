<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>{{TITLE}}</title>
<style>
:root{--accent:{{ACCENT}}}*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#060b16;color:#fff;overflow:hidden}.cover,.app{position:fixed;inset:0}.cover{z-index:2;display:grid;place-items:center;padding:24px;background:linear-gradient(120deg,rgba(3,7,18,.86),rgba(3,7,18,.35)),url('{{HERO_IMAGE}}') center/cover no-repeat;transition:opacity .5s,visibility .5s}.card{max-width:820px;text-align:center;padding:36px;border:1px solid rgba(255,255,255,.2);background:rgba(5,10,23,.55);border-radius:28px;backdrop-filter:blur(14px)}h1{font-size:clamp(38px,7vw,82px);line-height:1;margin:0 0 18px}p{font-size:clamp(16px,2vw,22px);line-height:1.7;color:#dbeafe}.launch{border:0;background:var(--accent);color:#fff;font:inherit;font-weight:800;padding:14px 22px;border-radius:999px;cursor:pointer}.app iframe{width:100%;height:100%;border:0;background:#fff}.started .cover{opacity:0;visibility:hidden}
</style></head><body>
<div class="cover"><div class="card"><div>{{KICKER}}</div><h1>{{TITLE}}</h1><p>{{SUMMARY}}</p><button class="launch" type="button" onclick="document.body.classList.add('started')">进入应用</button></div></div>
<div class="app"><iframe src="{{URL}}" title="{{TITLE}}" referrerpolicy="strict-origin-when-cross-origin" {{SANDBOX_ATTR}} allow="{{ALLOW}}" allowfullscreen></iframe></div>
</body></html>
