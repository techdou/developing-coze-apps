<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>{{TITLE}}</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:#0b1020;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.frame{width:100%;height:100%;border:0;display:block;background:#fff}.fallback{position:fixed;inset:auto 16px 16px 16px;z-index:2;display:flex;justify-content:center;pointer-events:none}.fallback a{pointer-events:auto;color:#fff;background:rgba(15,23,42,.82);padding:10px 14px;border-radius:999px;text-decoration:none;backdrop-filter:blur(8px)}
</style></head><body>
<iframe class="frame" src="{{URL}}" title="{{TITLE}}" loading="eager" referrerpolicy="strict-origin-when-cross-origin" {{SANDBOX_ATTR}} allow="{{ALLOW}}" allowfullscreen></iframe>
<div class="fallback"><a href="{{URL}}" target="_blank" rel="noopener noreferrer">无法显示时在新窗口打开</a></div>
</body></html>
